# @claude u issue-u ili PR komentaru → Claude Code radi task na GitHub-u.
# Radi sa Claude Pro/Max PRETPLATOM (bez API ključa): token se pravi lokalno komandom `claude setup-token`
# i čuva kao secret CLAUDE_CODE_OAUTH_TOKEN. Uputstvo: docs/WORKFLOW.md
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Samo vlasnik, članovi i saradnici repoa mogu da pokrenu Claude-a (repo je javan).
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bez "Co-Authored-By: Claude" u commit-ima (pravilo repoa)
          settings: |
            { "includeCoAuthoredBy": false }
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(corepack *),Bash(pnpm *),Bash(git *)"
