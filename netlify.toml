# Netlify: samo frontend (apps/web). Backend radi na mini PC-u.
[build]
  # Netlify sam instalira zavisnosti (prepoznaje pnpm iz pnpm-lock.yaml i "packageManager")
  command = "pnpm --filter @radar/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20.19.4"
  # VITE_API_URL (javna adresa API-ja) se ne drži u repou: podešava se u
  # Netlify → Site configuration → Environment variables. Bez nje build koristi localhost.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sigurnosna zaglavlja za dashboard
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Mikrofon je dozvoljen samo našem sajtu (unos glasom u AI polja); kamera i lokacija ostaju zabranjene
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
