# Netlify: samo frontend (apps/web). Backend radi na mini PC-u.
[build]
  # Netlify sam instalira zavisnosti (prepoznaje pnpm iz pnpm-lock.yaml i "packageManager")
  command = "pnpm --filter @radar/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20.19.4"
  # Javna adresa API-ja (mini PC preko Tailscale Funnel-a). Kad uzmemo domen → api.<domen>.
  VITE_API_URL = "https://aleksaserver.tail32786c.ts.net"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
