# AI router za ocenjivanje oglasa. Samo BESPLATNI modeli.
# Više rezervnih modela u istoj grupi "scorer": ako jedan ne radi (nema ključa, limit, ugašen model),
# LiteLLM ga stavi na pauzu, a worker pokuša ponovo (dobije drugi model).
# Ugašeni (nov. 2026): gemini-2.5-flash ("no longer available to new users"), groq llama-3.1-8b-instant. Nazive proveriti povremeno — besplatni modeli se menjaju.
model_list:
  # OpenRouter — modeli sa ":free" sufiksom ne naplaćuju se (0 $)
  - model_name: scorer
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  # Google Gemini — besplatan nivo (ako projekat nema uključen billing)
  - model_name: scorer
    litellm_params:
      model: gemini/gemini-3.8-flash   # Google ga sam preporučuje umesto ugašenog 2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: scorer
    litellm_params:
      model: gemini/gemini-flash-latest
      api_key: os.environ/GEMINI_API_KEY
  # Groq — besplatan nivo
  - model_name: scorer
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  - model_name: scorer
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY

  # ── AI Router za klijente (Faza 2) ─────────────────────────────────────────
  # "fast" = brzi/jeftini, "smart" = jači model. Klijent šalje model "auto" i mi biramo.
  # Za sada besplatni modeli; za produkciju dodati plaćene (npr. OpenAI/Anthropic ključ) u iste grupe.
  - model_name: fast
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: fast
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
  - model_name: smart
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: smart
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  routing_strategy: latency-based-routing   # bira najbrži model koji trenutno radi
  num_retries: 4          # pokušaj druge modele iz grupe ako jedan padne
  allowed_fails: 1        # model koji padne ide na pauzu…
  cooldown_time: 900      # …od 15 minuta

litellm_settings:
  drop_params: true       # izbaci parametre koje neki model ne podržava (npr. response_format)
  request_timeout: 60
