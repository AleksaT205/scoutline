# Ručno (iz korena repoa): docker compose --env-file .env up -d
# Coolify: Docker Compose resurs, Base directory "/", Compose file "/docker-compose.yml";
#          promenljive (POSTGRES_PASSWORD, LITELLM_MASTER_KEY…) se unose u Coolify → Environment Variables.
name: radar

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?postavi POSTGRES_PASSWORD u .env}
      POSTGRES_DB: radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      retries: 10
      start_period: 30s

  # Lokalni AI (rezerva). Velika slika — ne pokreće se podrazumevano:
  # docker compose --profile local-ai up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  litellm:
    build: { context: ., dockerfile: infra/litellm.Dockerfile }
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # LiteLLM koristi istu bazu (njegove tabele imaju prefiks LiteLLM_)
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?postavi LITELLM_MASTER_KEY u .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., args: { APP: api } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PORT: "3000"
      # Timska lozinka za dodavanje leadova iz dashboard-a (bez nje je dodavanje isključeno)
      API_TOKEN: ${API_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Taskovi u dashboard-u = GitHub Issues (Faza 7)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      # Ručno dodati leadovi se odmah ocenjuju preko LiteLLM-a
      LITELLM_URL: http://litellm:4000
      LITELLM_KEY: ${LITELLM_MASTER_KEY}
      # Za dugme "Send test" u podešavanjima obaveštenja
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://scoutline-app.netlify.app}
    ports:
      - "${API_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ., args: { APP: worker } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://radar:${POSTGRES_PASSWORD}@postgres:5432/radar
      LITELLM_URL: http://litellm:4000
      LITELLM_KEY: ${LITELLM_MASTER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFY_MIN_SCORE: ${NOTIFY_MIN_SCORE:-75}
      SCORE_BATCH: ${SCORE_BATCH:-10}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://scoutline-app.netlify.app}
      # Email-in (Faza 9): IMAP sanduče za obaveštenja platformi — docs/EMAIL-IN.md
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      # SAM.gov (US tenderi): besplatan javni API ključ sa sam.gov naloga
      SAM_API_KEY: ${SAM_API_KEY:-}
      # Delivery (Faza 11): PR-ovi → status taskova; isti token kao za API (pristup repoima projekata)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      api: { condition: service_healthy } # API primenjuje migracije baze
      litellm: { condition: service_started }

  # Automatski backup baze: jednom dnevno pg_dump u volume "backups", čuva poslednjih N dana.
  # ($$ = doslovan $ unutar docker compose fajla)
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[backup] start, cuva $${KEEP_DAYS} dana"
        while true; do
          f="/backups/radar-$$(date +%Y-%m-%d_%H%M).sql.gz"
          if pg_dump -h postgres -U radar radar | gzip > /backups/.in-progress; then
            mv /backups/.in-progress "$$f"
            echo "[backup] ok: $$f ($$(du -h "$$f" | cut -f1))"
          else
            echo "[backup] GRESKA pri pravljenju backup-a"
          fi
          find /backups -name 'radar-*.sql.gz' -mtime +$${KEEP_DAYS} -delete
          sleep 86400
        done
    depends_on:
      postgres: { condition: service_healthy }

  # Cloudflare Tunnel (kad uzmete domen): uključuje se sa --profile tunnel i CLOUDFLARE_TUNNEL_TOKEN
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  pgdata:
  ollama:
  backups:
